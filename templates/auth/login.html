{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="card form-narrow">
  <h1>Вхід</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email</label><input type="email" name="email" required autofocus>
    <label>Пароль</label><input type="password" name="password" required>
    <label class="checkbox"><input type="checkbox" name="remember"> Запам'ятати мене</label>
    <p><button class="btn">Увійти</button></p>
  </form>
  <p class="meta">Немає акаунта? <a href="{{ url_for('auth.register') }}">Зареєструватись</a></p>
</div>
{% endblock %}
