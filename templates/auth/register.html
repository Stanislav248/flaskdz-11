{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<div class="card form-narrow">
  <h1>Реєстрація</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Ім'я користувача</label><input name="username" value="{{ form.get('username','') }}" required>
    <label>Email</label><input type="email" name="email" value="{{ form.get('email','') }}" required>
    <label>Пароль (мін. 8 символів)</label><input type="password" name="password" required>
    <label>Повторіть пароль</label><input type="password" name="password2" required>
    <p><button class="btn">Створити акаунт</button></p>
  </form>
  <p class="meta">Уже є акаунт? <a href="{{ url_for('auth.login') }}">Увійти</a></p>
</div>
{% endblock %}
